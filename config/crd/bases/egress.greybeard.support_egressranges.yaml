---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.23.0
  name: egressranges.egress.greybeard.support
spec:
  group: egress.greybeard.support
  names:
    kind: EgressRanges
    listKind: EgressRangesList
    plural: egressranges
    shortNames:
    - egr
    singular: egressranges
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.enforced.digest
      name: Enforced
      type: string
    - jsonPath: .status.pending.digest
      name: Pending
      type: string
    - jsonPath: .status.pending.promoteAfter
      name: PromoteAfter
      type: string
    - jsonPath: .status.lastFetch.result
      name: LastFetch
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          EgressRanges keeps a NetworkPolicy's egress allowlist in sync with a
          provider's published ranges, behind a quarantine.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: EgressRangesSpec defines the desired behaviour.
            properties:
              approval:
                description: Approval configures how promotions are gated.
                properties:
                  maxChangeFraction:
                    default: "0.5"
                    description: |-
                      MaxChangeFraction: (added+removed)/len(enforced) above this needs approval.
                      Decimal string, e.g. "0.5".
                    pattern: ^(0(\.[0-9]+)?|1(\.0+)?)$
                    type: string
                  mode:
                    default: auto
                    description: |-
                      Mode "auto" promotes after the quarantine if all safety checks pass;
                      "manual" requires an approve-digest annotation for every change.
                    enum:
                    - auto
                    - manual
                    type: string
                  noReplyPolicy:
                    default: promote
                    description: |-
                      NoReplyPolicy applies only when verification is enabled and no
                      confirmation arrived by promoteAfter: "promote" (if safe) or "hold".
                    enum:
                    - promote
                    - hold
                    type: string
                type: object
              dnssec:
                description: DNSSECConfig configures endpoint resolution.
                properties:
                  requireAD:
                    default: true
                    description: RequireAD fails closed unless the resolver sets the
                      Authenticated Data flag.
                    type: boolean
                  resolvers:
                    default:
                    - tls://1.1.1.1:853#cloudflare-dns.com
                    - tls://9.9.9.9:853#dns.quad9.net
                    description: |-
                      Resolvers are validating recursive resolvers: "tls://ip:853#servername" (DNS over TLS, default)
                      or "ip:53" (plain DNS; the AD bit is then unauthenticated on the wire).
                    items:
                      type: string
                    type: array
                  timeout:
                    default: 5s
                    type: string
                type: object
              endpoints:
                description: |-
                  Endpoints are hostnames the workload must reach; their DNSSEC-validated
                  addresses must fall inside the candidate set.
                items:
                  type: string
                type: array
              ipFamilies:
                default:
                - IPv4
                description: IPFamilies to keep from the source and resolve for endpoints.
                items:
                  type: string
                type: array
              jitterPercent:
                default: 10
                description: JitterPercent randomises each poll by +/- this percent
                  of pollInterval.
                format: int32
                maximum: 50
                minimum: 0
                type: integer
              mode:
                default: minimal
                description: |-
                  Mode "minimal": pinned + source prefixes containing a resolved endpoint.
                  "all": pinned + every source prefix.
                enum:
                - minimal
                - all
                type: string
              networkPolicy:
                description: NetworkPolicyTemplate describes the NetworkPolicy the
                  controller owns.
                properties:
                  allowDNS:
                    default: true
                    description: AllowDNS adds an egress rule to cluster DNS (kube-system/k8s-app=kube-dns,
                      53/UDP+TCP).
                    type: boolean
                  name:
                    default: proton-bridge-egress-allow
                    type: string
                  podSelector:
                    description: PodSelector of the workload whose egress is restricted.
                    properties:
                      matchExpressions:
                        description: matchExpressions is a list of label selector
                          requirements. The requirements are ANDed.
                        items:
                          description: |-
                            A label selector requirement is a selector that contains values, a key, and an operator that
                            relates the key and values.
                          properties:
                            key:
                              description: key is the label key that the selector
                                applies to.
                              type: string
                            operator:
                              description: |-
                                operator represents a key's relationship to a set of values.
                                Valid operators are In, NotIn, Exists and DoesNotExist.
                              type: string
                            values:
                              description: |-
                                values is an array of string values. If the operator is In or NotIn,
                                the values array must be non-empty. If the operator is Exists or DoesNotExist,
                                the values array must be empty. This array is replaced during a strategic
                                merge patch.
                              items:
                                type: string
                              type: array
                              x-kubernetes-list-type: atomic
                          required:
                          - key
                          - operator
                          type: object
                        type: array
                        x-kubernetes-list-type: atomic
                      matchLabels:
                        additionalProperties:
                          type: string
                        description: |-
                          matchLabels is a map of {key,value} pairs. A single {key,value} in the matchLabels
                          map is equivalent to an element of matchExpressions, whose key field is "key", the
                          operator is "In", and the values array contains only "value". The requirements are ANDed.
                        type: object
                    type: object
                    x-kubernetes-map-type: atomic
                  ports:
                    default:
                    - port: 443
                      protocol: TCP
                    items:
                      description: PortSpec is a destination port for the rendered
                        policy.
                      properties:
                        port:
                          format: int32
                          maximum: 65535
                          minimum: 1
                          type: integer
                        protocol:
                          default: TCP
                          enum:
                          - TCP
                          - UDP
                          type: string
                      required:
                      - port
                      type: object
                    type: array
                required:
                - podSelector
                type: object
              notifyWebhook:
                description: |-
                  NotifyWebhook, if set, receives a JSON POST for every alert/queue event.
                  The controller's own NetworkPolicy must allow egress to it.
                type: string
              pinned:
                description: Pinned ranges are always enforced and never removed automatically.
                items:
                  type: string
                type: array
              pollInterval:
                default: 6h
                type: string
              quarantinePeriod:
                default: 72h
                type: string
              source:
                description: Source selects where candidate prefixes come from.
                properties:
                  ripestat:
                    description: |-
                      RIPEstatSource polls RIPEstat announced-prefixes for an ASN and keeps only
                      prefixes that RIPEstat's RPKI validator reports as "valid" for that origin.
                    properties:
                      asn:
                        description: ASN whose ROA-valid announced prefixes form the
                          source set.
                        format: int64
                        minimum: 1
                        type: integer
                      baseURL:
                        default: https://stat.ripe.net
                        description: BaseURL of the RIPEstat data API.
                        type: string
                      sourceApp:
                        default: egress-range-controller
                        description: SourceApp is sent as RIPEstat's sourceapp parameter.
                        type: string
                    required:
                    - asn
                    type: object
                  static:
                    description: |-
                      StaticSource is a fixed list. Useful for testing and for providers that only
                      publish a list on a web page. Prefixes are treated as trusted (no RPKI check).
                    properties:
                      cidrs:
                        items:
                          type: string
                        type: array
                    required:
                    - cidrs
                    type: object
                  type:
                    default: ripestat-rpki
                    enum:
                    - ripestat-rpki
                    - static
                    - url
                    type: string
                  url:
                    description: |-
                      URLSource fetches a plain-text list (one CIDR per line, '#' comments) over HTTPS.
                      Prefixes are treated as trusted (no RPKI check), so the quarantine is your only protection.
                    properties:
                      url:
                        pattern: ^https://
                        type: string
                    required:
                    - url
                    type: object
                required:
                - type
                type: object
              unreachableAlertAfter:
                default: 24h
                description: UnreachableAlertAfter raises reason AlertUnreachable24h
                  after this long without a successful fetch.
                type: string
              verification:
                description: |-
                  Verification configures the (disabled-by-default) verification email hook.
                  The controller only COMPOSES the email into status and an Event; it contains
                  no SMTP client. Delivery is left to an external, human-approved step.
                properties:
                  enabled:
                    default: false
                    type: boolean
                  from:
                    description: From is the sender identity shown in the composed
                      message.
                    type: string
                  minInterval:
                    default: 168h
                    description: MinInterval between composed emails (rate limit across
                      all digests).
                    type: string
                  to:
                    description: To is the provider's network-operations contact,
                      e.g. noc@proton.ch.
                    type: string
                type: object
            required:
            - networkPolicy
            - source
            type: object
          status:
            description: EgressRangesStatus is the observed state; it lives in etcd
              so restarts do not reset clocks.
            properties:
              conditions:
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              consecutiveFailures:
                format: int32
                type: integer
              enforced:
                description: RangeSet is an enforced set.
                properties:
                  cidrs:
                    items:
                      type: string
                    type: array
                  digest:
                    type: string
                  since:
                    format: date-time
                    type: string
                type: object
              firstFailure:
                format: date-time
                type: string
              lastFetch:
                description: FetchStatus records the last fetch attempt.
                properties:
                  candidate:
                    description: Candidate is the candidate set computed from the
                      last OK fetch.
                    items:
                      type: string
                    type: array
                  candidateDigest:
                    type: string
                  message:
                    type: string
                  resolvedEndpoints:
                    description: ResolvedEndpoints are "host=ip" pairs from the last
                      DNSSEC-validated lookup.
                    items:
                      type: string
                    type: array
                  result:
                    type: string
                  source:
                    type: string
                  time:
                    format: date-time
                    type: string
                required:
                - result
                - time
                type: object
              lastSuccess:
                format: date-time
                type: string
              lastVerificationAt:
                format: date-time
                type: string
              nextFetch:
                format: date-time
                type: string
              observedGeneration:
                format: int64
                type: integer
              pending:
                description: PendingSet is the quarantine slot (at most one).
                properties:
                  added:
                    items:
                      type: string
                    type: array
                  changeFraction:
                    type: string
                  cidrs:
                    items:
                      type: string
                    type: array
                  digest:
                    type: string
                  firstSeen:
                    format: date-time
                    type: string
                  lastConfirmed:
                    format: date-time
                    type: string
                  promoteAfter:
                    format: date-time
                    type: string
                  removed:
                    items:
                      type: string
                    type: array
                  safetyFailures:
                    description: SafetyFailures lists checks that currently block
                      automatic promotion.
                    items:
                      type: string
                    type: array
                  verification:
                    description: VerificationRequest is the composed (never sent)
                      verification email.
                    properties:
                      body:
                        type: string
                      composedAt:
                        format: date-time
                        type: string
                      from:
                        type: string
                      id:
                        type: string
                      state:
                        type: string
                      subject:
                        type: string
                      to:
                        type: string
                    required:
                    - id
                    - state
                    type: object
                required:
                - digest
                - firstSeen
                - lastConfirmed
                - promoteAfter
                type: object
              rejectedDigests:
                items:
                  type: string
                type: array
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}

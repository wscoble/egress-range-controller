# A non-Proton example: a fixed CIDR list, policy for app=example pods.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: example
resources:
  - ../../default
  - egressranges.yaml
patches:
  - target: { kind: Namespace, name: egress-range-controller }
    patch: |-
      - op: replace
        path: /metadata/name
        value: example
  - target: { kind: Role, name: egress-range-controller }
    patch: |-
      - op: replace
        path: /rules/3/resourceNames
        value: ["example-egress-allow"]
  # A static source needs no prefix-source or resolver egress (no endpoints).
  - target: { kind: NetworkPolicy, name: egress-range-controller }
    patch: |-
      - op: remove
        path: /spec/egress/3
      - op: remove
        path: /spec/egress/2
components:
  - ../../components/target-default-deny
  - ./target-selector

  names:
    kind: EgressRanges
    listKind: EgressRangesList
    plural: egressranges
    shortNames:
    - egr
    singular: egressranges
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.enforced.digest

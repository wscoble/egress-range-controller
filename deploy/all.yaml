      type: string
    - jsonPath: .status.pending.digest
      name: Pending
      type: string
    - jsonPath: .status.pending.promoteAfter
      name: PromoteAfter
      type: string
    - jsonPath: .status.lastFetch.result
      name: LastFetch
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: 'EgressRanges keeps a NetworkPolicy''s egress allowlist in sync
          with a

          provider''s published ranges, behind a quarantine.'
        properties:
          apiVersion:
            description: 'APIVersion defines the versioned schema of this representation
              of an object.

              Servers should convert recognized schemas to the latest internal value,
              and

              may reject unrecognized values.

              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources'
            type: string
          kind:
            description: 'Kind is a string value representing the REST resource this
              object represents.

              Servers may infer this from the endpoint the client submits requests
              to.

              Cannot be updated.

              In CamelCase.

              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds'
            type: string
          metadata:
            type: object
          spec:
            description: EgressRangesSpec defines the desired behaviour.
            properties:
              approval:
                description: Approval configures how promotions are gated.
                properties:
                  maxChangeFraction:
                    default: '0.5'
                    description: 'MaxChangeFraction: (added+removed)/len(enforced)
                      above this needs approval.

                      Decimal string, e.g. "0.5".'
                    pattern: ^(0(\.[0-9]+)?|1(\.0+)?)$
                    type: string
                  mode:
                    default: auto
                    description: 'Mode "auto" promotes after the quarantine if all
                      safety checks pass;

                      "manual" requires an approve-digest annotation for every change.'
                    enum:
                    - auto
                    - manual
                    type: string
                  noReplyPolicy:
                    default: promote
                    description: 'NoReplyPolicy applies only when verification is
                      enabled and no

                      confirmation arrived by promoteAfter: "promote" (if safe) or
                      "hold".'
                    enum:
                    - promote
                    - hold
                    type: string
                type: object
              dnssec:
                description: DNSSECConfig configures endpoint resolution.
                properties:
                  requireAD:
                    default: true
                    description: RequireAD fails closed unless the resolver sets the
                      Authenticated Data flag.
                    type: boolean
                  resolvers:
                    default:
                    - tls://1.1.1.1:853#cloudflare-dns.com
                    - tls://9.9.9.9:853#dns.quad9.net
                    description: 'Resolvers are validating recursive resolvers: "tls://ip:853#servername"
                      (DNS over TLS, default)

                      or "ip:53" (plain DNS; the AD bit is then unauthenticated on
                      the wire).'
                    items:
                      type: string
                    type: array
                  timeout:
                    default: 5s
                    type: string
                type: object
              endpoints:
                description: 'Endpoints are hostnames the workload must reach; their
                  DNSSEC-validated

                  addresses must fall inside the candidate set.'
                items:
                  type: string
                type: array
              ipFamilies:
                default:
                - IPv4
                description: IPFamilies to keep from the source and resolve for endpoints.
                items:
                  type: string
                type: array
              jitterPercent:
                default: 10
                description: JitterPercent randomises each poll by +/- this percent
                  of pollInterval.
                format: int32
                maximum: 50
                minimum: 0
                type: integer
              mode:
                default: minimal
                description: 'Mode "minimal": pinned + source prefixes containing
                  a resolved endpoint.

                  "all": pinned + every source prefix.'
                enum:
                - minimal
                - all
                type: string
              networkPolicy:
                description: NetworkPolicyTemplate describes the NetworkPolicy the
